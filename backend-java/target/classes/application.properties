# VEYRA Verification Microservice Configuration
server.port=${PORT:8085}

# Server-to-server internal API key
veyra.security.internal-api-key=${VEYRA_INTERNAL_API_KEY:veyra_secret_internal_token_2026}

# Idempotency cache TTL (seconds)
veyra.idempotency.ttl-seconds=${VEYRA_IDEMPOTENCY_TTL:86400}

# Maximum allowed packet age in seconds (replay attack protection)
veyra.packet.max-age-seconds=${VEYRA_PACKET_MAX_AGE:86400}

# Logging
logging.level.com.veyra.verification=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
